[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-strategy-consulting-assistant"
version = "1.0.0"
description = "AI-Powered Strategy Consulting Assistant using Case-Based Reasoning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.8.0",
    "scikit-learn==1.5.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "streamlit==1.37.0",
    "plotly==5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
